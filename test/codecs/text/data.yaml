RRULE:FREQ=WEEKLY;BYMONTH=1,2,3,8,9;BYDAY=MO,WE,TH,FR,SU:
  de: "Wöchentlich von Januar bis März, August und September montags, mittwochs bis freitags und sonntags"
  en: "Weekly in January – March, August & September on Monday, Wednesday – Friday & Sunday"
  es: "Todas las semanas de enero a marzo, agosto y septiembre los lunes, de miércoles a viernes y los domingos"
  fr: "Toutes les semaines de janvier à mars, en août et en septembre le lundi, du mercredi au vendredi et le dimanche"
  ja: 毎週 1月～3月・8月・9月に 月曜日・水曜日～金曜日・日曜日
  nl: "Wekelijks in januari – maart, augustus en september op maandag, woensdag – vrijdag en zondag"
RRULE:FREQ=WEEKLY;INTERVAL=2;BYMONTH=1,2,3;BYDAY=MO,TU,WE,TH,FR,SU:
  de: Jede zweite Woche von Januar bis März montags bis freitags und sonntags
  en: Every other week in January – March on weekdays & Sunday
  es: Cada dos semanas de enero a marzo de lunes a viernes y los domingos
  fr: Toutes les deux semaines de janvier à mars du lundi au vendredi et le dimanche
  ja: 隔週 1月～3月に 平日と日曜日
  nl: Om de twee weken in januari – maart op weekdagen en zondag
RRULE:FREQ=MONTHLY;BYDAY=MO,TU,WE,1TH,1FR,2TH,2FR,2SA,-2TH,-2FR,-2SU,-1TH,-1FR,-1SU;BYMONTHDAY=1,2,3,4,5,26,-3,-2,-1:
  de: "Monatlich montags bis mittwochs, am ersten Donnerstag und Freitag, am zweiten Donnerstag, Freitag und Samstag, am vorletzten Donnerstag, Freitag und Sonntag und am letzten Donnerstag, Freitag und Sonntag nur vom ersten bis zum fünften, am 26. oder vom drittletzten bis zum letzten Tag des Monats"
  en: "Monthly on every Monday – Wednesday, the 1st Thursday & Friday, the 2nd Thursday – Saturday, the 2nd-to-last Thursday, Friday & Sunday, and the last Thursday, Friday & Sunday that are also the 1st – 5th, 26th, or 3rd-to-last – last day of the month"
  es: "Todos los meses de lunes a miércoles, el primer jueves y viernes, el segundo jueves, viernes y sábado, el penúltimo jueves, viernes y domingo y el último jueves, viernes y domingo que caen del 1 al 5, el día 26 o del antepenúltimo al último día del mes"
  fr: "Tous les mois du lundi au mercredi, le 1er jeudi et vendredi, le 2e jeudi, vendredi et samedi, l'avant-dernier jeudi, vendredi et dimanche et le dernier jeudi, vendredi et dimanche qui tombent du 1er au 5e, le 26e ou de l'antépénultième au dernier jour du mois"
  ja: 毎月 月曜日～水曜日、第1木曜日と金曜日、第2木曜日～土曜日、最後から2番目の木曜日・金曜日・日曜日、最終木曜日・金曜日・日曜日 （各月の1日～5日、26日、または最後から3番目の日～末日に限る）
  nl: "Maandelijks op elke maandag – woensdag, de eerste donderdag en vrijdag, de 2de donderdag – zaterdag, de voorlaatste donderdag, vrijdag en zondag, en de laatste donderdag, vrijdag en zondag die tevens de eerste – 5de, 26ste of 3-na-laatste – laatste dag van de maand zijn"

